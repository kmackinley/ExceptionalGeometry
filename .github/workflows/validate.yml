name: Validate research claims

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Validate claim ledger and constants
        run: python scripts/validate_claims.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
